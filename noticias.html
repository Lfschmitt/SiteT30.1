<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T30.1 — Notícias</title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .modal-title {
      margin: 0 0 20px;
      color: #2B4365;
      font-size: 1.2rem;
    }

    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .modal-field label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
    }

    .modal-field input,
    .modal-field select,
    .modal-field textarea {
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #1e293b;
      background: #f8fafc;
      outline: none;
      transition: border-color 0.15s;
    }

    .modal-field input:focus,
    .modal-field select:focus,
    .modal-field textarea:focus {
      border-color: #2B4365;
    }

    .modal-field textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-modal-cancel {
      padding: 8px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #475569;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-modal-primary {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      background: #2B4365;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-modal-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .modal-error  { color: #dc2626; font-size: 0.85rem; margin-top: 6px; min-height: 18px; }
    .modal-success { color: #16a34a; font-size: 0.9rem; margin-top: 12px; text-align: center; }
    .modal-hidden  { display: none; }

    /* Botão adicionar */
    .btn-adicionar {
      padding: 8px 18px;
      background: #fff;
      color: #1e3a5f;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .btn-adicionar:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    .page-header-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .page-header-action {
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <main>

    <div class="page-header">
      <div class="page-header-row">
        <div></div>
        <div>
          <h1>Notícias</h1>
          <p>Informações e acontecimentos da T30.1</p>
        </div>
        <div class="page-header-action">
          <button id="btnAdicionarPublicacao" class="btn-adicionar">+ Adicionar</button>
        </div>
      </div>
    </div>

    <section>
      <div class="section-container">
        <div class="noticias-layout">

          <!-- Coluna principal: Notícias (~70%) -->
          <div class="noticias-col-main">
            <div class="painel-card">
              <div class="painel-card-title">
                <h2>Notícias</h2>
                <div class="section-divider"></div>
              </div>
              <div id="noticias-container">
                <div class="noticias-loading">Carregando notícias...</div>
              </div>
            </div>
          </div>

          <!-- Coluna lateral: Avisos (~30%) -->
          <div class="noticias-col-side">
            <div class="painel-card painel-card--avisos">
              <div class="painel-card-title">
                <h2>Avisos</h2>
                <div class="section-divider"></div>
              </div>
              <div id="avisos-container">
                <div class="noticias-loading">Carregando avisos...</div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <div id="footer"></div>

  <!-- Modal Adicionar Publicação -->
  <div id="modalPublicacao" class="modal-overlay modal-hidden">
    <div class="modal-box">

      <!-- Tela 1: Senha -->
      <div id="telaSenha">
        <h3 class="modal-title">Acesso restrito</h3>
        <div class="modal-field">
          <label for="inputSenha">Senha</label>
          <input type="password" id="inputSenha" placeholder="Digite a senha" />
          <span class="modal-error" id="erroSenha"></span>
        </div>
        <div class="modal-actions">
          <button class="btn-modal-cancel" id="btnCancelarSenha">Cancelar</button>
          <button class="btn-modal-primary" id="btnConfirmarSenha">Confirmar</button>
        </div>
      </div>

      <!-- Tela 2: Formulário -->
      <div id="telaForm" class="modal-hidden">
        <h3 class="modal-title">Adicionar Publicação</h3>

        <div class="modal-field">
          <label for="pubTipo">Tipo</label>
          <select id="pubTipo">
            <option value="noticias">Notícia</option>
            <option value="avisos">Aviso</option>
          </select>
        </div>

        <div class="modal-field">
          <label for="pubData">Data</label>
          <input type="date" id="pubData" />
        </div>

        <div class="modal-field">
          <label for="pubTitulo">Título</label>
          <input type="text" id="pubTitulo" placeholder="Título da publicação" />
        </div>

        <!-- Campos só para Notícia -->
        <div class="modal-field" id="campoCategoria">
          <label for="pubCategoria">Categoria</label>
          <input type="text" id="pubCategoria" placeholder="Ex: Evento, Resultado..." />
        </div>

        <div class="modal-field" id="campoResumo">
          <label for="pubResumo">Resumo</label>
          <textarea id="pubResumo" placeholder="Resumo da notícia..."></textarea>
        </div>

        <!-- Campo só para Aviso -->
        <div class="modal-field modal-hidden" id="campoDescricao">
          <label for="pubDescricao">Descrição</label>
          <textarea id="pubDescricao" placeholder="Descrição do aviso..."></textarea>
        </div>

        <div id="feedbackPublicacao"></div>
        <div class="modal-actions">
          <button class="btn-modal-cancel" id="btnCancelarForm">Cancelar</button>
          <button class="btn-modal-primary" id="btnSalvarPublicacao">Salvar</button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/noticias.js"></script>
  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGIlZXADiRjqVFZQVo5xCNyWRGfRTmmbqpjUhtcGZyUlzRipnNH-UXLF1r2_83Velq-g/exec';

    const modal      = document.getElementById('modalPublicacao');
    const telaSenha  = document.getElementById('telaSenha');
    const telaForm   = document.getElementById('telaForm');
    const inputSenha = document.getElementById('inputSenha');
    const erroSenha  = document.getElementById('erroSenha');
    const feedback   = document.getElementById('feedbackPublicacao');
    const btnSalvar  = document.getElementById('btnSalvarPublicacao');
    const pubTipo    = document.getElementById('pubTipo');

    function abrirModal() {
      telaSenha.classList.remove('modal-hidden');
      telaForm.classList.add('modal-hidden');
      inputSenha.value = '';
      erroSenha.textContent = '';
      feedback.textContent = '';
      modal.classList.remove('modal-hidden');
      inputSenha.focus();
    }

    function fecharModal() {
      modal.classList.add('modal-hidden');
    }

    document.getElementById('btnAdicionarPublicacao').addEventListener('click', abrirModal);
    document.getElementById('btnCancelarSenha').addEventListener('click', fecharModal);
    document.getElementById('btnCancelarForm').addEventListener('click', fecharModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) fecharModal(); });

    document.getElementById('btnConfirmarSenha').addEventListener('click', () => {
      const SHEET_ID = '1NMdFBmpz2OqX3W7hoez1B3pilpkEdOXnpfHiI2phLjI';
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=senha`;
      const digitada = inputSenha.value;

      fetch(url)
        .then(r => r.text())
        .then(csv => {
          const senhaCorreta = csv.split('\n')[0].split(',')[0].replace(/^"|"$/g, '').trim();
          if (digitada === senhaCorreta) {
            telaSenha.classList.add('modal-hidden');
            telaForm.classList.remove('modal-hidden');
          } else {
            erroSenha.textContent = 'Senha incorreta.';
            inputSenha.value = '';
            inputSenha.focus();
          }
        })
        .catch(() => {
          erroSenha.textContent = 'Erro ao verificar senha. Tente novamente.';
        });
    });

    inputSenha.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btnConfirmarSenha').click();
    });

    pubTipo.addEventListener('change', () => {
      const isNoticia = pubTipo.value === 'noticias';
      document.getElementById('campoCategoria').classList.toggle('modal-hidden', !isNoticia);
      document.getElementById('campoResumo').classList.toggle('modal-hidden', !isNoticia);
      document.getElementById('campoDescricao').classList.toggle('modal-hidden', isNoticia);
    });

    btnSalvar.addEventListener('click', async () => {
      const tipo   = pubTipo.value;
      const data   = document.getElementById('pubData').value;
      const titulo = document.getElementById('pubTitulo').value.trim();

      if (!data || !titulo) {
        feedback.innerHTML = '<span style="color:#dc2626;font-size:.85rem;">Preencha pelo menos Data e Título.</span>';
        return;
      }

      const [ano, mes, dia] = data.split('-');
      const dataFormatada = `${dia}/${mes}/${ano}`;

      btnSalvar.disabled = true;
      btnSalvar.textContent = 'Salvando...';
      feedback.textContent = '';

      let payload;
      if (tipo === 'noticias') {
        payload = {
          sheetName: 'noticias',
          Data: dataFormatada,
          Titulo: titulo,
          Resumo: document.getElementById('pubResumo').value.trim(),
          Categoria: document.getElementById('pubCategoria').value.trim() || 'Geral',
        };
      } else {
        payload = {
          sheetName: 'avisos',
          Data: dataFormatada,
          Titulo: titulo,
          Descricao: document.getElementById('pubDescricao').value.trim(),
        };
      }

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams(payload),
        });
        feedback.innerHTML = '<span class="modal-success">Publicação adicionada com sucesso!</span>';
        setTimeout(() => {
          fecharModal();
          loadAll();
        }, 1500);
      } catch {
        feedback.innerHTML = '<span style="color:#dc2626;font-size:.85rem;">Erro ao salvar. Verifique sua conexão.</span>';
      } finally {
        btnSalvar.disabled = false;
        btnSalvar.textContent = 'Salvar';
      }
    });
  </script>

</body>
</html>
